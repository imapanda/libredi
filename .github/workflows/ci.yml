# Continuous integration for every pull request and every push to main.
#
# Branch protection requires one check from this workflow: "CI result". It
# passes only when every job listed in its `needs` succeeded or was skipped,
# so adding a job here never requires changing the ruleset. See docs/ci-cd.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v4.0.2
      - run: editorconfig-checker

  links:
    name: Local links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: only relative links and anchors. External links are checked
      # weekly by links.yml so that a slow website never blocks a merge.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "./**/*.md"
          failIfEmpty: false
          jobSummary: false

  # Runs whatever the change is, unlike the jobs below that wait for `changes`: a directory file or a
  # registry can be committed anywhere in the tree.
  derived-data:
    name: Derived data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No UN/EDIFACT directory file, and no registry built from one, may be tracked (ADR 7).
      - run: scripts/check-derived-data.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          cache: false
          pyflakes: false

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # Decides which of the jobs below have something to check. The filtering happens in
  # the jobs, not on the workflow's `paths`: a workflow that does not run would never
  # report "CI result", and the required check would block the merge.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the files of a pull request
    outputs:
      workspace: ${{ steps.plan.outputs.workspace }}
      compose: ${{ steps.plan.outputs.compose }}
      ts-services: ${{ steps.plan.outputs.ts-services }}
      connectors: ${{ steps.plan.outputs.connectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            ts-shared: &ts-shared
              - '.github/workflows/ci.yml'
              - '.nvmrc'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'packages/service-kit/**'
              - 'scripts/smoke-image.sh'
            api:
              - *ts-shared
              - 'services/api/**'
            worker:
              - *ts-shared
              - 'services/worker/**'
            translator:
              - *ts-shared
              - 'services/translator/**'
            mcp:
              - *ts-shared
              - 'services/mcp/**'
            connectors:
              - '.github/workflows/ci.yml'
              - 'contracts/jobs/**'
              - 'contracts/openapi/**'
              - 'scripts/generate-go.sh'
              - 'scripts/smoke-image.sh'
              - 'services/connectors/**'
              - 'tools/codegen/**'
            workspace:
              - *ts-shared
              - '.devcontainer/**'
              - '.gitignore'
              - '.release-please-manifest.json'
              - 'biome.json'
              - 'contracts/**'
              - 'packages/**'
              - 'release-please-config.json'
              - 'samples/**'
              - 'scripts/check-pins.sh'
              - 'services/**'
              - 'tools/codegen/go.mod'
            compose:
              - *ts-shared
              - '.env.example'
              - 'compose.yaml'
              - 'infra/**'
              - 'scripts/**'
              - 'services/**'
      - id: plan
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          # A manual run has no base to compare with: check everything.
          if [ "$EVENT" = workflow_dispatch ]; then
            CHANGES='["workspace","compose","api","worker","translator","mcp","connectors"]'
          fi
          {
            echo "workspace=$(jq 'any(.[]; . == "workspace")' <<< "$CHANGES")"
            echo "compose=$(jq 'any(.[]; . == "compose")' <<< "$CHANGES")"
            echo "connectors=$(jq 'any(.[]; . == "connectors")' <<< "$CHANGES")"
            echo "ts-services=$(jq -c '[.[] | select(IN("api", "worker", "translator", "mcp"))]' <<< "$CHANGES")"
          } >> "$GITHUB_OUTPUT"

  workspace:
    name: Workspace (Biome, pins, shared packages, contracts)
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Node.js, pnpm, Go and Biome versions agree across files
        run: scripts/check-pins.sh
      - run: pnpm --filter "./packages/*" typecheck
      - run: pnpm --filter "./packages/*" test

  # One job per TypeScript service, run only when that service or a shared package changed.
  typescript-service:
    name: Service (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.ts-services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.ts-services) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@libredi/$SERVICE..."
      - run: pnpm --filter "@libredi/$SERVICE" typecheck
      - run: pnpm --filter "@libredi/$SERVICE" test
      - run: pnpm --filter "@libredi/$SERVICE" build
      - name: Build the image, run it, check health, user and clean shutdown
        run: scripts/smoke-image.sh "$SERVICE"

  connectors:
    name: Service (connectors)
    needs: changes
    if: needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/connectors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/connectors/go.mod
          cache: false # the module has no dependency yet, hence no go.sum to key the cache on
      - name: Generated Go code is what contracts/ generate
        working-directory: .
        run: |
          scripts/generate-go.sh
          # A reviewer skims generated code: it must not contain code that runs at start-up.
          if grep -rn '^func init(' services/connectors/internal/generated; then
            echo "::error::Generated code must not define init functions."
            exit 1
          fi
          drift=$(git status --porcelain --untracked-files=all -- services/connectors/internal/generated)
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff -- services/connectors/internal/generated
            echo "::error::The generated Go code is out of date. Run scripts/generate-go.sh and commit the result."
            exit 1
          fi
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build the image, run it, check health, user and clean shutdown
        working-directory: .
        run: scripts/smoke-image.sh connectors

  compose:
    name: Compose (3 workers)
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack with 3 workers and check it
        run: scripts/smoke-compose.sh

  ci-result:
    name: CI result
    if: always()
    needs:
      - markdown
      - spelling
      - editorconfig
      - links
      - derived-data
      - actionlint
      - zizmor
      - dependency-review
      - changes
      - workspace
      - typescript-service
      - connectors
      - compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Some jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
